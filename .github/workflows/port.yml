name: OpenHarmony port
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: port-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host:
    name: Host bootstrap (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Fetch pinned upstream tree
        shell: pwsh
        run: |
          $base = (Get-Content ohos/source.json | ConvertFrom-Json).upstream_commit
          git fetch --no-tags --depth=1 origin $base
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.3'
          cache: false
      - name: Script and documentation checks
        run: python -m unittest discover -s ohos/tests -p "test_*.py" -v
      - name: Documentation links
        run: python ohos/scripts/check_docs.py
      - name: Verify source
        run: python ohos/scripts/manage.py verify
      - name: Bootstrap pinned source
        shell: pwsh
        run: |
          $bootstrap = go env GOROOT
          python ohos/scripts/manage.py bootstrap --bootstrap $bootstrap
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Focused compiler and certificate tests
        run: python ohos/scripts/manage.py test
      - name: Preserve build receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: host-receipts-${{ matrix.os }}
          path: |
            ohos/out/bootstrap.json
            ohos/out/host-tests.json
          if-no-files-found: warn
          retention-days: 14
